<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Growth Lab</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #120b08, #050505);
  color: white;
}

/* HEADER */
header {
  text-align: center;
  padding: 70px 20px;
}

header h1 {
  font-size: 55px;
  color: #d4af37;
}

header p {
  opacity: 0.8;
}

/* NAV */
nav {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 15px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

nav a:hover {
  color: #d4af37;
}

/* BOOK GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 25px;
  padding: 40px;
}

/* BOOK COVER (CUSTOM DESIGN) */
.book {
  height: 280px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-weight: bold;
  font-size: 20px;
  padding: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  transition: 0.4s;
}

/* different book styles */
.book1 {
  background: linear-gradient(135deg, #3b2f2f, #000);
}

.book2 {
  background: linear-gradient(135deg, #1a1a1a, #3d2b1f);
}

.book3 {
  background: linear-gradient(135deg, #2c1f1a, #0f0f0f);
}

.book4 {
  background: linear-gradient(135deg, #1c1c1c, #4a3b2a);
}

.book:hover {
  transform: scale(1.05);
  box-shadow: 0 25px 60px rgba(0,0,0,0.8);
}

/* TEXT STYLE */
.book span {
  color: #d4af37;
  letter-spacing: 1px;
}
</style>

</head>

<body>

<header>
  <h1>The Growth Lab</h1>
  <p>A cinematic journey of self-growth, psychology & transformation</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="journey.html">Journey</a>
  <a href="courses.html">Courses</a>
  <a href="about.html">About</a>
</nav>

<section>

<h2 style="text-align:center;">📚 Your Book Universe</h2>

<div class="grid">

  <div class="book book1">
    <span>Mila’s Journey</span>
  </div>

  <div class="book book2">
    <span>Grow With Mila</span>
  </div>

  <div class="book book3">
    <span>The Growth Lab Book</span>
  </div>

  <div class="book book4">
    <span>Mind Upgrade System</span>
  </div>

</div>

</section>

</body>
</html>
