<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Growth Lab</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;

  background: url("https://images.unsplash.com/photo-1524995997946-a1c2e315a42f")
  no-repeat center center fixed;
  background-size: cover;

  color: white;
}

/* dark cinematic overlay */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(20, 10, 5, 0.65);
  z-index: -1;
}

/* header */
header {
  text-align: center;
  padding: 70px 20px;
}

header h1 {
  font-size: 55px;
  color: #d4af37;
  text-shadow: 0 0 20px rgba(0,0,0,0.6);
}

header p {
  opacity: 0.8;
}

/* navigation */
nav {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 15px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

nav a:hover {
  color: #d4af37;
}

/* book grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 25px;
  padding: 40px;
}

.book {
  text-align: center;
  transition: 0.4s;
}

.book img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 15px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.7);
  transition: 0.4s;
}

.book p {
  margin-top: 10px;
  color: #d4af37;
  font-weight: bold;
}

.book:hover {
  transform: scale(1.05);
}

.book img:hover {
  transform: scale(1.08);
}
</style>

</head>

<body>

<div class="overlay"></div>

<header>
  <h1>The Growth Lab</h1>
  <p>A cinematic journey of self-growth and psychology</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="journey.html">Journey</a>
  <a href="courses.html">Courses</a>
  <a href="about.html">About</a>
</nav>

<section>
  <h2 style="text-align:center;">📚 Book Universe</h2>

  <div class="grid">

    <div class="book">
      <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f">
      <p>Mila’s Journey</p>
    </div>

    <div class="book">
      <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f">
      <p>Grow With Mila</p>
    </div>

    <div class="book">
      <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba">
      <p>The Growth Lab Book</p>
    </div>

    <div class="book">
      <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794">
      <p>Mind Upgrade System</p>
    </div>

  </div>
</section>

</body>
</html>
