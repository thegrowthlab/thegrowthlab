  <style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;

  background: url("https://images.unsplash.com/photo-1524995997946-a1c2e315a42f")
  no-repeat center center fixed;

  background-size: cover;

  color: #fff;

  <div class="overlay"></div>
  .overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(20, 10, 5, 0.65);
  z-index: -1;
}

  header {
    text-align: center;
    padding: 70px 20px;
    animation: fadeDown 1s ease-out;
  }

  header h1 {
    font-size: 60px;
    color: #d4af37;
    letter-spacing: 2px;
    text-shadow: 0 0 25px rgba(212,175,55,0.25);
  }

  header p {
    opacity: 0.8;
    font-size: 18px;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 15px;
    background: rgba(20,10,5,0.6);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
  }

  nav a {
    color: #f5f5f5;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
  }

  nav a:hover {
    color: #d4af37;
    transform: scale(1.1);
  }

  section {
    max-width: 900px;
    margin: auto;
    padding: 50px 20px;
  }

  h2 {
    color: #d4af37;
    letter-spacing: 1px;
  }

  .card {
    background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.3));
    border: 1px solid rgba(212,175,55,0.15);
    padding: 25px;
    margin-top: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    transition: 0.5s;
    animation: fadeUp 1s ease-in;
  }

  .card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  }

  footer {
    text-align: center;
    padding: 30px;
    opacity: 0.5;
  }

  /* ANIMATIONS */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
